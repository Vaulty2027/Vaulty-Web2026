<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="icon"
    href="img/logo_vaulty+.png"
    type="image/png"
  >

  <title data-atm-title>Mapa de ATMs en Panamá</title>


  <!-- =========================================================
    MAPLIBRE GL JS
  ========================================================= -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.css"
  >


  <!-- =========================================================
    CSS DEL MAPA
  ========================================================= -->

  <link
    rel="stylesheet"
    href="mapa-ATM.css"
  >

</head>


<body>

  <div class="app">


    <!-- =======================================================
      SIDEBAR
    ======================================================== -->

    <div class="sidebar">


      <!-- =====================================================
        BOTÓN DE REGRESO
      ====================================================== -->

      <div class="volver-container">

        <a
          href="ATM.html"
          class="btn-volver"
        >

          <span
            class="flecha"
            aria-hidden="true"
          >
            ←
          </span>

          <span data-atm-i18n="back">
            Volver a ATM
          </span>

        </a>

      </div>



      <!-- =====================================================
        TÍTULO
      ====================================================== -->

      <h1>

        <span class="dot"></span>

        <span data-atm-i18n="pageTitle">
          ATMs en Panamá
        </span>

      </h1>



      <!-- =====================================================
        SUBTÍTULO
      ====================================================== -->

      <p
        class="sub"
        data-atm-i18n="subtitle"
      >
        Todas las Provincias
      </p>



      <!-- =====================================================
        BUSCADOR
      ====================================================== -->

      <div class="search-box">

        <input
          id="searchInput"
          type="text"
          data-atm-i18n-placeholder="search"
          placeholder="Buscar por nombre o dirección..."
          autocomplete="off"
        >

      </div>



      <!-- =====================================================
        FILTRO DE CIUDAD
      ====================================================== -->

      <div
        class="filter-label"
        data-atm-i18n="cityZone"
      >
        Ciudad / Zona
      </div>


      <select id="citySelect">

        <option
          value="all"
          data-atm-i18n="allZones"
        >
          Todas las zonas
        </option>

      </select>



      <!-- =====================================================
        FILTRO DE BANCO
      ====================================================== -->

      <div
        class="filter-label"
        data-atm-i18n="filterBank"
      >
        Filtrar por banco
      </div>


      <div
        class="bank-filters"
        id="bankFilters"
      >
      </div>



      <!-- =====================================================
        ESTADÍSTICAS
      ====================================================== -->

      <div class="stats">

        <span data-atm-i18n="showing">
          Mostrando
        </span>

        <b id="countShown">
          0
        </b>

        <span data-atm-i18n="of">
          de
        </span>

        <b id="countTotal">
          0
        </b>

        <span data-atm-i18n="atms">
          ATMs
        </span>

      </div>



      <!-- =====================================================
        RESULTADOS
      ====================================================== -->

      <div
        class="list-label"
        data-atm-i18n="results"
      >
        Resultados
      </div>


      <div
        class="atm-list"
        id="atmList"
      >
      </div>


    </div>



    <!-- =======================================================
      MAPA
    ======================================================== -->

    <div id="map"></div>


  </div>



  <!-- =========================================================
    MAPA-ATM.JS
  ========================================================= -->

  <script
    type="module"
    src="mapa-ATM.js"
  ></script>



  <!-- =========================================================
    AUTENTICACIÓN DE VAULTY+
  ========================================================= -->

  <script
    type="module"
    src="auth.js"
  ></script>


</body>

</html>
